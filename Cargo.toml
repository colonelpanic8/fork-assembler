[package]
name = "fork-fold"
version = "0.1.0"
edition = "2021"
description = "Assemble a stack of live fork branches onto an upstream base with tracked conflict resolutions"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"

[dev-dependencies]
tempfile = "3"
